# REFRESCO RÁPIDO DE ESPAÑA: solo el mercado "es" (pre-owned + stock, todos los modelos), cada 10 minutos de
# 07:00 a 00:00 (hora España, verano). ~15 requests y ~1-2 min por run. Avisa de cambios (Telegram / ntfy / email)
# y publica. Comparte el grupo `concurrency` con el refresco general (nunca se solapan; si el general está corriendo,
# este espera; si se acumulan runs en cola solo se conserva el más reciente).
# Nota: GitHub no ejecuta crons con menos de 5 min de intervalo y en horas punta los retrasa varios minutos.
name: Refresh España (rápido)

on:
  schedule:
    # Cron en UTC. Verano: 05-22 UTC = 07:00-00:50 hora peninsular. En invierno queda una hora antes (06:00-23:50).
    - cron: '*/10 5-22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh-es:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync with latest main
        run: |
          git config user.name "polestar-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
      - name: Refresh España (pre-owned + stock, todos los modelos)
        run: node src/fetch.js --market=es --delay=1000 --history=none
      - name: Notify changes (Telegram / ntfy / email)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          NOTIFY_MARKETS: ${{ vars.NOTIFY_MARKETS || 'es' }}
          NOTIFY_MODELS: ${{ vars.NOTIFY_MODELS || 'P3,P4' }}
          NOTIFY_SOURCES: ${{ vars.NOTIFY_SOURCES || 'preowned,stock' }}
          NOTIFY_VARIANTS: ${{ vars.NOTIFY_VARIANTS || '' }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS || 'new,drop' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://invernati.github.io/PolestarTracker/' }}
        run: node src/notify.js
      - name: Commit data
        run: |
          git add data public/data
          if git diff --cached --quiet; then echo "sin cambios en data/"; exit 0; fi
          git commit -m "data: refresh ES $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push falló (intento $i), reintentando…"; git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh-es
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
